<!DOCTYPE html>
<html>
<head>
    <title>Donation Dashboard</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f9;
        }

        .header {
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .amount {
            font-size: 40px;
            color: #22c55e;
        }

        .progress-bar {
            width: 100%;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #22c55e;
            width: 0%;
            transition: width 0.5s ease;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f1f5f9;
            margin: 5px 0;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }

        .last {
            background: #fff7ed;
            border-left: 5px solid orange;
        }

        .donate-btn {
            display: block;
            text-align: center;
            background: #3b82f6;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #22c55e;
            color: white;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>

<body>

<div class="header">💰 Donation Dashboard</div>

<div class="container">

    <div class="card">
        <h3>Total Collected</h3>
        <div class="amount" id="total">₹0</div>
    </div>

    <div class="card">
        <h3>Goal Progress</h3>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <p id="percent">0%</p>
    </div>

    <div class="card last">
        <h3>⏱ Last Donation</h3>
        <p id="last">No donations yet</p>
    </div>

    <div class="card">
        <h3>Recent Donations</h3>
        <ul id="donations"></ul>
    </div>

    <a href="https://rzp.io/rzp/4pyAtqKt" target="_blank" class="donate-btn">
        Donate Now
    </a>

</div>

<div class="popup" id="popup"></div>

<script>
let lastAmountShown = 0;

async function loadData() {
    const res = await fetch("/data");
    const data = await res.json();

    document.getElementById("total").innerText = "₹" + data.total;

    // Progress
    let GOAL = 3500;
    let percent = (data.total / GOAL) * 100;
    if (percent > 100) percent = 100;
    document.getElementById("progress").style.width = percent + "%";
    document.getElementById("percent").innerText =
        percent.toFixed(1) + "% of ₹3,500";



    // Last donation
    if (data.last) {
        document.getElementById("last").innerText =
            "₹" + data.last.amount + " at " + data.last.time;

        // Popup
        if (data.last.amount !== lastAmountShown) {
            showPopup(data.last.amount);
            lastAmountShown = data.last.amount;
        }
    }

    // List
    let list = "";
    data.donations.slice().reverse().forEach(d => {
        list += `<li><span>₹${d.amount}</span><span>${d.time}</span></li>`;
    });

    document.getElementById("donations").innerHTML = list;
}

function showPopup(amount) {
    const popup = document.getElementById("popup");
    popup.innerText = `🎉 ₹${amount} donated!`;
    popup.style.display = "block";

    setTimeout(() => {
        popup.style.display = "none";
    }, 3000);
}

setInterval(loadData, 3000);
loadData();
</script>

</body>
</html>
